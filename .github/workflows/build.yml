name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomRankJoinMessagesNK
          path: target/CustomRankJoinMessagesNK-*.jar
          if-no-files-found: error
