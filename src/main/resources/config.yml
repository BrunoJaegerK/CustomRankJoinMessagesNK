# Enable or disable join and quit messages independently.
ModifyJoinMessages: true
ModifyLeaveMessages: true

# Keys must match LuckPerms primary group names. Missing groups use "default".
# Available message placeholder: {name}
joinMessages:
  owner: "§l§7[§a+§7] [§cOwner§7] {name}"
  developer: "§l§7[§a+§7] [§bDeveloper§7] {name}"
  moderator: "§l§7[§a+§7] [§9Moderator§7] {name}"
  vip++: "§l§7[§a+§7] [§eVIP++§7] {name}"
  default: "§l§7[§a+§7] {name}"

leaveMessages:
  owner: "§l§7[§c-§7] [§cOwner§7] {name}"
  developer: "§l§7[§c-§7] [§bDeveloper§7] {name}"
  moderator: "§l§7[§c-§7] [§dModerator§7] {name}"
  vip++: "§l§7[§c-§7] [§eVIP++§7] {name}"
  default: "§l§7[§c-§7] {name}"

# Sounds are heard by all other online players, not by the player joining/leaving.
# Use Bedrock/Nukkit sound identifiers. Set enabled: false to disable an individual sound.
# Missing rank entries fall back to "default".
joinSounds:
  owner:
    enabled: true
    sound: "random.levelup"
  developer:
    enabled: true
    sound: "random.orb"
  moderator:
    enabled: true
    sound: "random.pop"
  vip++:
    enabled: true
    sound: "random.levelup"
  default:
    enabled: true
    sound: "random.pop"

leaveSounds:
  owner:
    enabled: true
    sound: "random.pop"
  developer:
    enabled: true
    sound: "random.orb"
  moderator:
    enabled: true
    sound: "random.pop"
  vip++:
    enabled: true
    sound: "random.pop"
  default:
    enabled: true
    sound: "random.pop"
